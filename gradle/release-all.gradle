  bomPom.set(layout.projectDirectory.file('matrix-bom/bom.xml'))
  allPom.set(layout.projectDirectory.file('matrix-bom/pom.xml'))
  manifestFile.set(manifest)
  reportFile.set(output.map { it.file('report.txt') })
  userName.set(credentialsUser)
  password.set(credentialsPassword)
