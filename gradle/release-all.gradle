import groovy.json.JsonOutput
import org.gradle.api.artifacts.ProjectDependency
import org.gradle.api.publish.maven.MavenPublication

def releaseLoader = rootProject.plugins.find { it.class.name == 'se.alipsa.gradle.plugin.release.ReleaseAllSupportPlugin' }.class.classLoader
def ReleaseManifest = releaseLoader.loadClass('se.alipsa.gradle.plugin.release.ReleaseManifest')
def CentralPortalClient = releaseLoader.loadClass('se.alipsa.gradle.plugin.release.CentralPortalClient')

// Only loaded in the release workflow: the development plugin is resolved through includeBuild.
def output = layout.buildDirectory.dir('releaseAll')
def manifest = output.map { it.file('manifest.json') }
def staged = output.map { it.dir('staging') }
def credentialsUser = providers.gradleProperty('sonatypeUsername').orElse(providers.environmentVariable('SONATYPE_USERNAME'))
def credentialsPassword = providers.gradleProperty('sonatypePassword').orElse(providers.environmentVariable('SONATYPE_PASSWORD'))
def repository = providers.gradleProperty('releaseAllRepositoryUrl').orElse('https://repo.maven.apache.org/maven2')
def portal = providers.gradleProperty('releaseAllPortalUrl').orElse(CentralPortalClient.CENTRAL_PORTAL_URL)

