  sourceDirectory.set(layout.projectDirectory)
  manifestFile.set(manifest)
  stagingDirectory.set(staged)
  bundleFile.set(output.map { it.file('bundle.zip') })
}
tasks.named('releaseAll') {
  receiptFile.set(output.map { it.file('bundle-receipt.json') })
  portalFixture.set(layout.projectDirectory.file('req/releaseAll-portal-fixture.json'))
  sourceDirectory.set(layout.projectDirectory)
  manifestFile.set(manifest)
  bundleFile.set(output.map { it.file('bundle.zip') })
