// Discovery records serializable values; actions never access the live Gradle model.
def configureRelease = {
  List<Map> candidates = []
  subprojects.findAll { !it.path.startsWith(':matrix-examples') }.each { Project module ->
    def publishing = module.extensions.findByType(org.gradle.api.publish.PublishingExtension)
    if (publishing == null) return
    def releaseExtension = module.extensions.findByName('nexusReleasePlugin')
    def publication = releaseExtension?.mavenPublication?.present ? releaseExtension.mavenPublication.get() : null
    if (publication == null) return
    List<Map> edges = []
    ['compileClasspath', 'runtimeClasspath'].each { String configuration ->
      module.configurations.findByName(configuration)?.hierarchy?.each { origin ->
        origin.dependencies.withType(ProjectDependency).each { dependency ->
        def target = rootProject.project(dependency.path)
        def targetPublication = target.extensions.findByName('nexusReleasePlugin')?.mavenPublication?.get()
        if (targetPublication == null) throw new GradleException('Production project dependency has no registered release publication')
        edges.add([groupId: targetPublication.groupId, artifactId: targetPublication.artifactId,
                   version: targetPublication.version, origin: "${origin.name} -> ${configuration}".toString()])
        }
      }
    }
    String taskName = "generatePomFileFor${publication.name.capitalize()}Publication"
    String pomPath = "${module.name}/build/publications/${publication.name}/pom-default.xml"
    String prefix = "${publication.artifactId}-${publication.version}"
    def files = ["${prefix}.pom".toString()] + publication.artifacts.findAll { it.extension == 'jar' }.collect { artifact ->
      "${prefix}${artifact.classifier ? '-' + artifact.classifier : ''}.${artifact.extension}".toString()
    }
    candidates.add([projectPath: module.path, publication: publication.name, pomFile: pomPath,
                    groupId: publication.groupId, artifactId: publication.artifactId, version: publication.version,
                    files: files, dependencies: edges.unique()])
    tasks.named('releaseAllPlan') {
      dependsOn(module.tasks.named(taskName))
      candidatePoms.from(rootProject.file(pomPath))
    }
    module.publishing.repositories.maven {
      name = 'releaseAllStaging'
      url = staged.get().asFile.toURI()
    }
  }
  tasks.named('releaseAllPlan') { candidatesJson.set(JsonOutput.toJson(candidates)) }
  if (providers.gradleProperty('releaseAllPrepare').isPresent()) {
    Map plan = ReleaseManifest.read(manifest.get().asFile)
    tasks.named('releaseAllGuard') {
      manifestFile.set(manifest)
      sourceDirectory.set(layout.projectDirectory)
      versionsJson.set(JsonOutput.toJson(candidates.collectEntries { [it.projectPath, it.version] }))
    }
    subprojects.each { module ->
      module.tasks.configureEach { mustRunAfter(rootProject.tasks.named('releaseAllGuard')) }
    }
    tasks.register('releaseAllStage') {
      dependsOn(tasks.named('releaseAllGuard'))
      plan.selected.findAll { it.projectPath }.each { component ->
        dependsOn("${component.projectPath}:publish${component.publication.capitalize()}PublicationToReleaseAllStagingRepository")
      }
    }
  }
}

tasks.named('releaseAllPrepareMaven') {
  mavenWorkDirectory.set(layout.projectDirectory.dir('matrix-bom'))
  verifierFile.set(layout.projectDirectory.file('matrix-bom/verifyBomApi.sh'))
  settingsHelperFile.set(layout.projectDirectory.file('scripts/release-all/staged-settings.groovy'))
  sourceDirectory.set(layout.projectDirectory)
  manifestFile.set(manifest)
  stagingDirectory.set(staged)
  localRepository.set(output.map { it.dir('maven-local') })
}

configureRelease()

tasks.named('releaseAllSigningCheck') {
  Map<String, Boolean> configured = subprojects.findAll { it.extensions.findByName('signing') != null }.collectEntries { module ->
    boolean available
    try {
      available = module.extensions.getByType(org.gradle.plugins.signing.SigningExtension).signatory != null
    } catch (Exception ignored) {
      available = false
    }
    [module.path, available]
  }
  configuredSigningJson.set(JsonOutput.toJson(configured))
  manifestFile.set(manifest)
  strict.set(!providers.gradleProperty('releaseAllSigningReport').isPresent())
}
