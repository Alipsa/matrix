plugins {
    id 'groovy'
    id 'java-library'
    id 'signing'
    id 'maven-publish'
    alias(libs.plugins.alipsaNexusRelease)
}

group = 'se.alipsa.matrix'
version = '0.8.0-SNAPSHOT'
description = "Groovy library for importing and exporting parquet files to and from a Matrix"

JavaCompile javaCompile = compileJava {
    options.release = 21
    options.deprecation = true
    options.compilerArgs << "-Xlint:unchecked"
}

compileGroovy {
    options.deprecation = true
}

dependencies {
    compileOnly libs.groovy
    compileOnly project(':matrix-core')
    testImplementation project(':matrix-core')
    testImplementation project(':matrix-datasets')
    implementation libs.parquet.column
    implementation libs.parquet.hadoop
    implementation(libs.hadoop.common) {
        exclude group: 'org.slf4j', module: 'slf4j-reload4j'
        exclude group: 'ch.qos.reload4j', module: 'reload4j'
        //exclude group: 'com.google.guava'  // optional: prevent old guava
        //exclude group: 'org.apache.hadoop.thirdparty'
        exclude group: 'org.apache.zookeeper'
        exclude group: 'com.fasterxml.jackson.core'
        exclude group: 'io.netty'                   // ✅ Netty
        exclude group: 'com.squareup.okhttp3'       // optional, sometimes pulled transitively
    }
    implementation(libs.hadoop.mapreduce.client.core) {
        exclude group: 'org.slf4j', module: 'slf4j-reload4j'
        exclude group: 'ch.qos.reload4j', module: 'reload4j'
    }
    testImplementation libs.junit.jupiter.api
    testImplementation libs.groovier.junit
    testRuntimeOnly libs.junit.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.groovy
}

test {
    ['parquet.baseline', 'parquet.layoutBenchmark', 'parquet.datasetBenchmark', 'parquet.benchmarkRows'].each { key ->
        def value = providers.gradleProperty(key).orNull
        if (value != null) { systemProperty key, value }
    }
    testLogging.showStandardStreams = true
    useJUnitPlatform()
}

//Maven Central uploads
task javadocJar(type: Jar, dependsOn: groovydoc) {
    archiveClassifier.set('javadoc')
    from groovydoc.destinationDir
}


task sourcesJar(type: Jar, dependsOn: classes) {
    archiveClassifier.set('sources')
    from sourceSets.main.allSource
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            artifact(javadocJar)
            artifact(sourcesJar)
            pom {
                name = 'Matrix Parquet'
                description = "${project.description}"
                url = 'https://github.com/Alipsa/matrix/tree/main/matrix-parquet'
                properties = [
                    'maven.compiler.release': "${javaCompile.options.release.get()}"
                ]
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://raw.githubusercontent.com/Alipsa/matrix/refs/heads/main/LICENSE'
                    }
                }
                developers {
                    developer {
                        id = 'perNyfelt'
                        name = 'Per Nyfelt'
                    }
                }
                scm {
                    url = 'https://github.com/Alipsa/matrix/tree/main/matrix-parquet'
                    connection = 'scm:git:https://github.com/Alipsa/matrix.git'
                    developerConnection = 'scm:git:https://github.com/Alipsa/matrix.git'
                }
            }
        }
    }
    if (project.ext.properties.sonatypeUsername) {
        repositories {
            maven {
                credentials {
                    username = sonatypeUsername
                    password = sonatypePassword
                }
            }
        }
    }
}

signing {
    if (project.properties['signing.keyId'] != null) {
        //project.logger.lifecycle("Signing artifacts...")
        sign publishing.publications.maven
    } else {
        project.logger.debug("signing.keyId is not defined, skipping signing of artifacts...")
    }
}

nexusReleasePlugin {
    userName = project.ext.properties.sonatypeUsername
    password = project.ext.properties.sonatypePassword
    mavenPublication = publishing.publications.maven
}

// Generate the default-size CDC case outside the repository only for the slow lane.
boolean runCdcSlowTests = providers.gradleProperty('runSlowTests').orNull == 'true'
File parquetProjectDirectory = projectDir
tasks.register('generateDefaultCdcFixture') {
    onlyIf { runCdcSlowTests }
    doLast {
        String python = System.getenv('PARQUET_PYTHON') ?: 'python3'
        try {
            def probe = new ProcessBuilder(python, '-c', 'import pyarrow; assert pyarrow.__version__ == "21.0.0"').inheritIO().start()
            if (probe.waitFor() != 0) {
                logger.lifecycle('SKIP default CDC fixture: pinned PyArrow 21.0.0 is unavailable')
                return
            }
        } catch (IOException ignored) {
            logger.lifecycle('SKIP default CDC fixture: Python is unavailable')
            return
        }
        def generation = new ProcessBuilder(python, 'src/test/python/generate_optimized.py',
            'build/default-cdc', '--default-cdc').directory(parquetProjectDirectory).inheritIO().start()
        if (generation.waitFor() != 0) { throw new GradleException('CDC fixture generation failed') }
    }
}
tasks.named('test') { dependsOn 'generateDefaultCdcFixture' }

// Diagnostic spike: report runtime classes still required by upstream codec/writer code.
tasks.register('codecWithoutHadoop', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath.filter { !it.name.startsWith('hadoop-') }
    useJUnitPlatform()
    include '**/ParquetCodecProbeTest.class'
    systemProperty 'parquet.codecSpike', 'true'
    testLogging.showStandardStreams = true
}

tasks.register('compileConsumerApi', JavaCompile) {
    dependsOn classes
    source = fileTree('src/consumerTest/java') { include '**/*.java' }
    classpath = sourceSets.test.compileClasspath.filter {
        !it.name.startsWith('parquet-') && !it.name.startsWith('hadoop-')
    } + sourceSets.main.output
    destinationDirectory = layout.buildDirectory.dir('consumer-api')
    options.release = 21
}
tasks.named('check') { dependsOn 'compileConsumerApi' }
