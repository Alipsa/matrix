org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1024m
# Bound Gradle worker leases for all entry points, including IDE and Tooling API builds.
org.gradle.workers.max=12
org.gradle.configuration-cache=true
# Report configuration cache problems as warnings instead of errors.
# This setting prevents cache problems from failing the build.
org.gradle.configuration-cache.problems=warn
