plugins {
  id('java-library')
  id('signing')
  id('maven-publish')
  alias(libs.plugins.alipsaNexusRelease)
}

group = 'se.alipsa.matrix'
version = '0.1.2-SNAPSHOT'
description = 'Convenience logging setup for Matrix Groovy scripts'

ext.nexusUrl = version.toString().endsWith("SNAPSHOT")
    ? "https://oss.sonatype.org/content/repositories/snapshots/"
    : "https://oss.sonatype.org/service/local/staging/deploy/maven2/"

JavaCompile javaCompile = compileJava {
  options.release = 21
  options.deprecation = true
  options.compilerArgs << "-Xlint:unchecked"
}

dependencies {
  runtimeOnly platform(libs.slf4j.bom)

  // Default lightweight SLF4J provider for Groovy scripts and small tools.
  runtimeOnly libs.slf4j.simple

  // Route Matrix's JDK System.Logger usage to SLF4J.
  runtimeOnly libs.slf4j.jdk.platform.logging

  // Route Log4j API usage from third-party libraries to SLF4J.
  runtimeOnly libs.log4j.to.slf4j

  testImplementation platform(libs.junit.bom)
  testImplementation libs.junit.jupiter.api
  testRuntimeOnly libs.junit.jupiter.engine
  testRuntimeOnly libs.junit.platform.launcher

  // Log4j API only, to drive the log4j-to-slf4j routing smoke test.
  testImplementation libs.log4j.api
}

test {
  useJUnitPlatform()
}

// This root-level guide is deliberately an input so edits to either user-facing
// snippet revalidate the documented release coordinate.
def documentedVersionFiles = [file('README.md'), rootProject.file('docs/logging.md')]
String documentedMatrixLoggingVersion = version.toString() - '-SNAPSHOT'
File documentedVersionMarker = layout.buildDirectory.file('verification/documented-version.txt').get().asFile

tasks.register('checkDocumentedVersion') {
  description = 'Checks that matrix-logging documentation uses the current release version.'
  group = 'verification'
  inputs.files(documentedVersionFiles)
  inputs.property('matrixLoggingVersion', documentedMatrixLoggingVersion)
  outputs.file(documentedVersionMarker)

  doLast {
    String expectedCoordinate = "se.alipsa.matrix:matrix-logging:${documentedMatrixLoggingVersion}"
    documentedVersionFiles.each { File documentation ->
      def documentedCoordinates = documentation.text.findAll(/se\.alipsa\.matrix:matrix-logging:[^'\"\s)]+/)
      if (!documentedCoordinates || documentedCoordinates.any { it != expectedCoordinate }) {
        throw new GradleException("${documentation} must use ${expectedCoordinate}")
      }
    }
    documentedVersionMarker.parentFile.mkdirs()
    documentedVersionMarker.text = "${expectedCoordinate}\n"
  }
}

tasks.named('check') {
  dependsOn tasks.named('checkDocumentedVersion')
}

tasks.register('javadocJar', Jar) {
  dependsOn javadoc
  archiveClassifier.set('javadoc')
  from javadoc.destinationDir
}

tasks.register('sourcesJar', Jar) {
  dependsOn classes
  archiveClassifier.set('sources')
  from sourceSets.main.allSource
}

publishing {
  publications {
    maven(MavenPublication) {
      from components.java
      artifact(javadocJar)
      artifact(sourcesJar)
      pom {
        name = 'Matrix Logging'
        description = "${project.description}"
        url = "https://github.com/Alipsa/matrix/tree/main/matrix-logging"
        properties = [
            'maven.compiler.release': "${javaCompile.options.release.get()}"
        ]
        licenses {
          license {
            name = 'MIT License'
            url = 'https://raw.githubusercontent.com/Alipsa/matrix/main/LICENSE'
          }
        }
        developers {
          developer {
            id = 'perNyfelt'
            name = 'Per Nyfelt'
          }
        }
        scm {
          url = 'https://github.com/Alipsa/matrix/tree/main/matrix-logging'
          connection = 'scm:git:https://github.com/Alipsa/matrix.git'
          developerConnection = 'scm:git:https://github.com/Alipsa/matrix.git'
        }
      }
    }
  }
  if (project.ext.properties.sonatypeUsername) {
    repositories {
      maven {
        credentials {
          username = sonatypeUsername
          password = sonatypePassword
        }
        url = nexusUrl
      }
    }
  }
}

signing {
  if (project.properties['signing.keyId'] != null) {
    sign publishing.publications.maven
  } else {
    project.logger.debug("signing.keyId is not defined, skipping signing of artifacts...")
  }
}

nexusReleasePlugin {
  userName = project.ext.properties.sonatypeUsername
  password = project.ext.properties.sonatypePassword
  mavenPublication = publishing.publications.maven
}
