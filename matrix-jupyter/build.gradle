plugins {
  id 'groovy'
  id('java-library')
  id('maven-publish')
  id('signing')
  alias(libs.plugins.alipsaNexusRelease)
}

group = 'se.alipsa.matrix'
version = '0.1.0-SNAPSHOT'
description = 'Jupyter display renderers for Matrix tables and SVG charts'

JavaCompile javaCompile = compileJava {
  options.release = 21
  options.deprecation = true
}

java {
  withJavadocJar()
  withSourcesJar()
}

dependencies {
  api project(':matrix-core')
  compileOnly libs.groovy
  compileOnly project(':matrix-charts')
  compileOnly project(':matrix-ggplot')
  compileOnly project(':matrix-pict')
  compileOnly libs.gsvg
  compileOnly libs.jjava.jupyter

  testImplementation libs.junit.jupiter
  testImplementation libs.groovier.junit
  testRuntimeOnly libs.junit.platform.launcher
  testImplementation libs.groovy
  testImplementation project(':matrix-charts')
  testImplementation project(':matrix-ggplot')
  testImplementation project(':matrix-pict')
  testImplementation libs.gsvg
  testImplementation libs.jjava.jupyter
}

test { useJUnitPlatform() }

def smokeClasspath = sourceSets.test.runtimeClasspath.filter { File file -> !(file.name ==~ /groovy-\d.*\.jar/) }

def compareGroovy6Candidates = { File first, File second ->
  boolean firstPrerelease = first.name.contains('-')
  boolean secondPrerelease = second.name.contains('-')
  if (firstPrerelease != secondPrerelease) return firstPrerelease ? -1 : 1
  List<Integer> firstParts = first.name.tokenize('-').first().tokenize('.').collect { String part -> part as int }
  List<Integer> secondParts = second.name.tokenize('-').first().tokenize('.').collect { String part -> part as int }
  int partCount = [firstParts.size(), secondParts.size()].max()
  for (int index = 0; index < partCount; index++) {
    int firstPart = index < firstParts.size() ? firstParts[index] : 0
    int secondPart = index < secondParts.size() ? secondParts[index] : 0
    int comparison = firstPart <=> secondPart
    if (comparison != 0) return comparison
  }
  first.name <=> second.name
}

def groovy6Executable = providers.gradleProperty('groovy6Executable')
    .orElse(providers.environmentVariable('GROOVY_6_HOME').map { "${it}/bin/groovy" })
    .orElse(providers.systemProperty('user.home').map { String home ->
      File candidates = new File(home, '.sdkman/candidates/groovy')
      List<File> versions = candidates.listFiles()?.findAll { File candidate -> candidate.directory && candidate.name ==~ /^6\.\d+(?:\.\d+)*(?:-(?:alpha|beta|rc)-?\d*)?$/ } ?: []
      File newest = versions.max(compareGroovy6Candidates)
      newest ? new File(newest, 'bin/groovy').absolutePath : new File(candidates, '6.x/bin/groovy').absolutePath
    })

tasks.register('groovy6Smoke', Exec) {
  group = 'verification'
  description = 'Runs Matrix Jupyter core and Charm rendering with an SDKMAN Groovy 6 runtime.'
  dependsOn testClasses
  args '-cp', smokeClasspath.asPath, layout.projectDirectory.file('src/test/resources/groovy6-smoke.groovy').asFile.absolutePath
  doFirst {
    File groovy6Binary = new File(groovy6Executable.get())
    if (!groovy6Binary.canExecute()) {
      throw new GradleException("Groovy 6 executable is unavailable at ${groovy6Binary}. Set -Pgroovy6Executable or GROOVY_6_HOME.")
    }
    logger.lifecycle("Running Groovy 6 smoke test with ${groovy6Binary}")
    executable groovy6Binary
    environment.remove('GROOVY_HOME')
    File groovyHome = groovy6Binary.parentFile.parentFile
    if (new File(groovyHome, 'lib').isDirectory()) {
      environment 'GROOVY_HOME', groovyHome.absolutePath
    }
  }
}

publishing {
  publications {
    maven(MavenPublication) {
      from components.java
      pom {
        name = 'Matrix Jupyter renderers'
        description = project.description
        url = 'https://github.com/Alipsa/matrix/tree/main/matrix-jupyter'
        properties = ['maven.compiler.release': "${javaCompile.options.release.get()}"]
        licenses {
          license {
            name = 'MIT'
            url = 'https://raw.githubusercontent.com/Alipsa/matrix/main/matrix-jupyter/LICENSE'
          }
        }
        developers {
          developer {
            id = 'perNyfelt'
            name = 'Per Nyfelt'
          }
        }
        scm {
          url = 'https://github.com/Alipsa/matrix'
          connection = 'scm:git:https://github.com/Alipsa/matrix.git'
          developerConnection = 'scm:git:https://github.com/Alipsa/matrix.git'
        }
      }
    }
  }
  if (project.ext.properties.sonatypeUsername) {
    repositories {
      maven {
        credentials {
          username = sonatypeUsername
          password = sonatypePassword
        }
      }
    }
  }
}

signing {
  if (project.properties['signing.keyId'] != null) {
    sign publishing.publications.maven
  }
}

nexusReleasePlugin {
  userName = project.ext.properties.sonatypeUsername
  password = project.ext.properties.sonatypePassword
  mavenPublication = publishing.publications.maven
}
