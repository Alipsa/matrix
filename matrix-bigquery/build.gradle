import org.gradle.api.tasks.testing.Test
import org.gradle.api.tasks.testing.logging.TestExceptionFormat
import org.gradle.api.tasks.testing.logging.TestLogEvent

plugins {
  id 'groovy'
  id 'java-library'
  id 'signing'
  id 'maven-publish'
  alias(libs.plugins.alipsaNexusRelease)
}

configurations {
  mockitoAgent
}

group = 'se.alipsa.matrix'
version = '0.7.2-SNAPSHOT'
description = "Groovy library for importing and exporting to and from Google BigQuery to a Matrix"

JavaCompile javaCompile = compileJava {
  options.release = 21
  options.deprecation = true
  options.compilerArgs << "-Xlint:unchecked"
}

compileGroovy {
  options.deprecation = true
}

dependencies {
  compileOnly project(':matrix-core')
  testImplementation project(':matrix-core')
  testImplementation project(':matrix-datasets')
  compileOnly libs.groovy

  api libs.google.cloud.bigquery
  api libs.google.cloud.resourcemanager
  implementation platform(libs.google.auth.library.bom)
  implementation libs.google.auth.library.oauth2.http
  implementation libs.google.cloud.bigquery.storage
  implementation libs.progressbar
  implementation libs.groovy.json

  // https://mvnrepository.com/artifact/org.testcontainers/gcloud
  testImplementation libs.testcontainers.gcloud
  testImplementation libs.testcontainers.junit.jupiter
  testImplementation libs.groovy
  testImplementation libs.junit.jupiter.api
  testImplementation libs.groovier.junit
  testImplementation libs.mockito.core
  mockitoAgent platform(libs.mockito.bom)
  mockitoAgent(libs.mockito.core) {
    transitive = false
  }
  testRuntimeOnly libs.junit.jupiter.engine
  testRuntimeOnly libs.junit.platform.launcher
}

def configureBigQueryTestTask = { Test testTask ->
  testTask.jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}", '-Xshare:off'
  testTask.maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1
  testTask.testLogging {
    // set options for log level LIFECYCLE
    events TestLogEvent.FAILED,
        TestLogEvent.SKIPPED,
        TestLogEvent.STANDARD_OUT
    exceptionFormat = TestExceptionFormat.FULL
    showExceptions = true
    showCauses = true
    showStackTraces = true
    showStandardStreams = true

    // set options for log level DEBUG and INFO
    debug {
      events TestLogEvent.STARTED,
          TestLogEvent.FAILED,
          TestLogEvent.PASSED,
          TestLogEvent.SKIPPED,
          TestLogEvent.STANDARD_ERROR,
          TestLogEvent.STANDARD_OUT
      exceptionFormat = TestExceptionFormat.FULL
    }
    info.events = debug.events
    info.exceptionFormat = debug.exceptionFormat
  }
}

test {
  configureBigQueryTestTask(delegate as Test)
  useJUnitPlatform {
    excludeTags 'external', 'flaky'
  }
}

tasks.register('externalTest', Test) {
  description = 'Runs external BigQuery and flaky emulator integration tests.'
  group = 'verification'
  dependsOn testClasses
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  configureBigQueryTestTask(delegate as Test)
  useJUnitPlatform {
    includeTags 'external', 'flaky'
  }
}

//Maven Central uploads
task javadocJar(type: Jar, dependsOn: groovydoc) {
  archiveClassifier.set('javadoc')
  from groovydoc.destinationDir
}


task sourcesJar(type: Jar, dependsOn: classes) {
  archiveClassifier.set('sources')
  from sourceSets.main.allSource
}

publishing {
  publications {
    maven(MavenPublication) {
      from components.java
      artifact(javadocJar)
      artifact(sourcesJar)
      pom {
        name = 'Matrix BigQuery'
        description = "${project.description}"
        url = "https://github.com/Alipsa/matrix/tree/main/matrix-bigquery"
        properties = [
            'maven.compiler.release': "${javaCompile.options.release.get()}"
        ]
        licenses {
          license {
            name = 'MIT License'
            url = 'https://raw.githubusercontent.com/Alipsa/matrix/matrix-bigquery/master/LICENSE'
          }
        }
        developers {
          developer {
            id = 'perNyfelt'
            name = 'Per Nyfelt'
          }
        }
        scm {
          url = 'https://github.com/Alipsa/matrix/matrix-bigquery/tree/master'
          connection = 'scm:git:https://github.com/Alipsa/matrix.git'
          developerConnection = 'scm:git:https://github.com/Alipsa/matrix.git'
        }
      }
    }
  }
  if (project.ext.properties.sonatypeUsername) {
    repositories {
      maven {
        credentials {
          username = sonatypeUsername
          password = sonatypePassword
        }
      }
    }
  }
}

signing {
  if (project.properties['signing.keyId'] != null) {
    //project.logger.lifecycle("Signing artifacts...")
    sign publishing.publications.maven
  } else {
    project.logger.debug("signing.keyId is not defined, skipping signing of artifacts...")
  }
}

nexusReleasePlugin {
  userName = project.ext.properties.sonatypeUsername
  password = project.ext.properties.sonatypePassword
  mavenPublication = publishing.publications.maven
}
